name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.8", "3.9", "3.11", "3.13"]
        exclude:
          # macOS runners are slow/costly: cover one Python there, all on Linux.
          - os: macos-latest
            python: "3.8"
          - os: macos-latest
            python: "3.9"
          - os: macos-latest
            python: "3.13"
    defaults:
      run:
        working-directory: plugins/aws-secure-ops/skills/aws-secure-ops/scripts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Compile every script
        run: python -m py_compile ./*.py

      - name: Validate plugin JSON packaging
        working-directory: .
        run: |
          python -m json.tool .claude-plugin/marketplace.json >/dev/null
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
          python -m json.tool plugins/aws-secure-ops/.claude-plugin/plugin.json >/dev/null
          python -m json.tool plugins/aws-secure-ops/.codex-plugin/plugin.json >/dev/null
          python -m json.tool plugins/aws-secure-ops/hooks/hooks.json >/dev/null

      - name: Validate dual-runtime packaging contract
        run: python test-plugin-packaging.py

      - name: Decision corpus
        run: python run-corpus.py

      - name: Property / differential fuzz
        run: python test-gate-properties.py

      - name: Gate unit suite
        run: bash test-classify-aws-command.sh

      - name: Gate hardening suite
        run: bash test-gate-hardening.sh

      - name: Evasion corpus suite
        run: bash test-evasion-corpus.sh

      - name: Terminal shim suite
        run: bash test-shim.sh

      - name: Hook launcher suite
        run: bash test-run-gate.sh

      - name: Shared hook runtime dispatcher
        run: python test-hook-dispatch.py

      - name: Codex fail-closed read-only suite
        run: python test-codex-readonly.py

      - name: Doctor policy contract (offline)
        run: python test-doctor-policy.py

      - name: Codex packaged doctor (offline)
        working-directory: .
        run: |
          unset SSL_CERT_FILE SSL_CERT_DIR REQUESTS_CA_BUNDLE CURL_CA_BUNDLE
          unset HTTPS_PROXY HTTP_PROXY ALL_PROXY NO_PROXY
          unset https_proxy http_proxy all_proxy no_proxy SSLKEYLOGFILE
          unset BASH_ENV ENV ZDOTDIR
          unset PYTHONHOME PYTHONPATH PYTHONINSPECT PYTHONSTARTUP PYTHONWARNINGS PYTHONBREAKPOINT PYTHONUSERBASE
          unset LD_PRELOAD LD_LIBRARY_PATH BOTO_CONFIG AWS_DATA_PATH
          policy_file="$(mktemp)"
          trap 'rm -f "$policy_file"' EXIT
          printf '%s\n' '{"operator":{"name":"ci","stamp_prefix":"xx"},"profiles":{"ci-read":"readonly"},"required_tags":{},"ledger":false}' >"$policy_file"
          chmod 600 "$policy_file"
          AWS_OPS_HOOK_RUNTIME=codex \
          AWS_OPS_MODE=readonly \
          AWS_OPS_TRUSTED_AWS_CLI=/usr/bin/true \
          AWS_OPS_POLICY_FILE="$policy_file" \
          AWS_OPS_LEDGER_FILE=/dev/null \
          PLUGIN_ROOT="$GITHUB_WORKSPACE/plugins/aws-secure-ops" \
          python plugins/aws-secure-ops/skills/aws-secure-ops/scripts/aws-ops-doctor.py --quick

      - name: Installer suite
        run: bash test-install.sh

      - name: Inventory integrity
        run: python verify-inventory.py

      - name: Version consistency
        run: python release.py --check
